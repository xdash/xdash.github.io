<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<meta name="theme-color" content="#ffe0b2">
<title>🕯️ 吹蜡烛</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { background: linear-gradient(170deg, #ffe6c7 0%, #ffd0a8 45%, #ffc0a0 100%); overflow: hidden; }
  #stage { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 4vh 0 6vh; }
  .cake { position: relative; width: min(72vw, 70vh, 540px); }
  .plate {
    height: 26px; border-radius: 50%; margin: 0 -6%;
    background: linear-gradient(#fff, #e8eef5); box-shadow: 0 10px 24px rgba(160,90,40,.28);
  }
  .layer { position: relative; border-radius: 18px 18px 12px 12px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.07); }
  .l1 { height: 96px; background: linear-gradient(#ffb3c7, #ff8fae); margin: 0 4%; }
  .l2 { height: 78px; background: linear-gradient(#ffd59e, #ffbf70); margin: 0 10%; margin-top: -10px; }
  .icing {
    position: absolute; left: 0; right: 0; top: -1px; height: 26px;
    background: #fff; border-radius: 18px 18px 40% 40% / 18px 18px 60% 60%;
    box-shadow: 0 4px 0 rgba(0,0,0,.05);
  }
  .icing::after {
    content: ''; position: absolute; left: -2%; right: -2%; top: 16px; height: 20px;
    background: radial-gradient(circle at 10px 0, #fff 9px, transparent 10px) repeat-x;
    background-size: 26px 22px;
  }
  .sprinkles { position: absolute; inset: 34px 12px auto 12px; height: 40px; }
  .sprinkles i { position: absolute; width: 10px; height: 4px; border-radius: 3px; transform: rotate(var(--r)); }
  .cherry { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #ff7d7d, #d92b2b); box-shadow: 0 2px 4px rgba(120,20,20,.35); }
  .candles { position: absolute; left: 0; right: 0; bottom: 148px; display: flex; justify-content: center; gap: 16%; }
  .candle { position: relative; width: 18px; }
  .stick {
    height: 76px; border-radius: 5px;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #ff6b8a 6px 12px);
    box-shadow: 0 2px 6px rgba(120,60,40,.3);
  }
  .wick { width: 3px; height: 8px; background: #5b3a2e; margin: 0 auto; border-radius: 2px; }
  .flame {
    position: absolute; left: 50%; top: -42px; width: 20px; height: 34px;
    margin-left: -10px; transform-origin: 50% 100%;
    background: radial-gradient(circle at 50% 78%, #fff8c9 0%, #ffd93b 38%, #ff9d1f 68%, rgba(255,90,0,.2) 100%);
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    box-shadow: 0 0 18px 6px rgba(255,190,60,.55);
    animation: flick .55s ease-in-out infinite alternate;
    transition: transform .18s, opacity .35s;
  }
  .flame::after {
    content: ''; position: absolute; left: 50%; top: 52%; width: 8px; height: 12px;
    margin-left: -4px; background: rgba(255,255,255,.85); border-radius: 50%; filter: blur(1px);
  }
  @keyframes flick {
    from { transform: scale(1, 1) rotate(-4deg); }
    to   { transform: scale(.92, 1.08) rotate(4deg); }
  }
  .blowing .flame { animation: none; transform: scaleX(.5) rotate(-26deg) translateY(2px); opacity: .78; }
  .hint-wind {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 2.4vh; z-index: 40;
    background: rgba(255,255,255,.9); color: #a1511d; border-radius: 22px;
    padding: 8px 22px; font-weight: 800; font-size: clamp(15px, 3vh, 22px);
    box-shadow: 0 4px 14px rgba(160,90,40,.28); white-space: nowrap; pointer-events: none;
  }
  .smoke {
    position: absolute; left: 50%; top: -46px; width: 10px; height: 10px; margin-left: -5px;
    background: rgba(150,150,160,.55); border-radius: 50%; filter: blur(2px);
    animation: rise 1.1s ease-out forwards; pointer-events: none;
  }
  @keyframes rise {
    from { transform: translate(0, 0) scale(.6); opacity: .8; }
    to   { transform: translate(var(--sx), -70px) scale(1.8); opacity: 0; }
  }
  body.party .cake { animation: hop .5s ease-in-out 3; }
  @keyframes hop {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-14px) scale(1.02); }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="cake" id="cake">
    <div class="candles">
      <div class="candle" data-c="0"><div class="flame"></div><div class="wick"></div><div class="stick"></div></div>
      <div class="candle" data-c="1"><div class="flame"></div><div class="wick"></div><div class="stick"></div></div>
      <div class="candle" data-c="2"><div class="flame"></div><div class="wick"></div><div class="stick"></div></div>
    </div>
    <div class="l1 layer">
      <div class="icing"></div>
      <div class="sprinkles">
        <i style="--r:20deg; background:#ff6b6b; left:8%; top:14px"></i>
        <i style="--r:-30deg; background:#6fc3ff; left:32%; top:26px"></i>
        <i style="--r:60deg; background:#ffe14d; left:56%; top:12px"></i>
        <i style="--r:-10deg; background:#8be58b; left:78%; top:24px"></i>
      </div>
      <span class="cherry" style="left:16%; top:-8px"></span>
      <span class="cherry" style="right:18%; top:-6px"></span>
    </div>
    <div class="l2 layer"><div class="icing"></div></div>
    <div class="plate"></div>
  </div>
</div>
<div class="hint-wind" id="hint">按住任何键，用力吹 —— 呼～ 🕯️</div>
<script src="../common.js"></script>
<script>
(function () {
  var cake = document.getElementById('cake');
  var hint = document.getElementById('hint');
  var candles = [].slice.call(document.querySelectorAll('.candle'));
  var lit = [true, true, true];
  var held = {};
  var holdMs = 0;
  var blown = 0;
  var party = false;

  Kid.mountChrome();

  // 持续风声：一个循环噪声源 + 增益，按住时抬高
  var wind = null;
  function startWind() {
    var c = Kid.audio(); if (!c) return;
    if (wind) return;
    var len = Math.floor(c.sampleRate * 1.2);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) { last = last * 0.92 + (Math.random() * 2 - 1) * 0.08; d[i] = last * 3; }
    var s = c.createBufferSource(); s.buffer = buf; s.loop = true;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 620; f.Q.value = 0.7;
    var g = c.createGain(); g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(0.09, c.currentTime + 0.35);
    s.connect(f); f.connect(g); g.connect(Kid.bus() || c.destination);
    s.start();
    wind = { s: s, g: g };
  }
  function stopWind() {
    if (!wind) return;
    var c = Kid.audio();
    try {
      wind.g.gain.cancelScheduledValues(c.currentTime);
      wind.g.gain.setValueAtTime(wind.g.gain.value || 0.0001, c.currentTime);
      wind.g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.25);
      wind.s.stop(c.currentTime + 0.3);
    } catch (e) {}
    wind = null;
  }

  function blowOut(i) {
    if (!lit[i]) return;
    lit[i] = false;
    blown++;
    var c = candles[i];
    c.classList.remove('blowing');
    var fl = c.querySelector('.flame');
    fl.style.opacity = '0';
    fl.style.transform = 'scale(.2) translateY(6px)';
    var smoke = document.createElement('div');
    smoke.className = 'smoke';
    smoke.style.setProperty('--sx', (Math.random() * 30 - 15) + 'px');
    c.appendChild(smoke);
    setTimeout(function () { smoke.parentNode && smoke.parentNode.removeChild(smoke); }, 1200);
    Kid.noise(0.22, { filter: 'bandpass', freq: 420, vol: 0.16, decay: 1.6 });
    Kid.tone(300 + i * 40, 0.12, { to: 180, type: 'sine', vol: 0.07 });
    if (blown >= 3) celebrate();
  }

  function celebrate() {
    party = true;
    document.body.classList.add('party');
    Kid.confetti(document.body, 46, { x: 50, y: 34 });
    var notes = [392, 392, 440, 392, 523, 494, 392, 392, 440, 392, 587, 523];
    notes.forEach(function (f, i) {
      setTimeout(function () { Kid.tone(f, 0.26, { type: 'triangle', vol: 0.14 }); }, i * 230);
    });
    setTimeout(function () {
      Kid.speak('呼——蜡烛全灭啦！' + Kid.name() + '，' + Kid.praise() + '！许个愿吧！');
    }, 400);
    hint.textContent = '🎂 生日快乐！等一会儿蜡烛会重新亮起来';
    setTimeout(relight, 5200);
  }

  function relight() {
    party = false;
    document.body.classList.remove('party');
    lit = [true, true, true];
    blown = 0;
    holdMs = 0;
    candles.forEach(function (c, i) {
      var fl = c.querySelector('.flame');
      fl.style.opacity = '';
      fl.style.transform = '';
      setTimeout(function () { Kid.tone(660 + i * 90, 0.18, { type: 'sine', vol: 0.09 }); }, i * 160);
    });
    hint.textContent = '按住任何键，用力吹 —— 呼～ 🕯️';
  }

  Kid.onKey(function (e) {
    if (e.repeat) return;
    held[e.code] = true;
    if (!party) {
      document.body.classList.add('blowing');
      candles.forEach(function (c) { c.classList.add('blowing'); });
      startWind();
    }
  }, { allowRepeat: true, preventDefault: true });

  window.addEventListener('keyup', function (e) {
    delete held[e.code];
    if (!anyHeld()) {
      document.body.classList.remove('blowing');
      candles.forEach(function (c) { c.classList.remove('blowing'); });
      stopWind();
      holdMs = 0;
    }
  });
  window.addEventListener('blur', function () {
    held = {}; stopWind(); holdMs = 0;
    document.body.classList.remove('blowing');
    candles.forEach(function (c) { c.classList.remove('blowing'); });
  });

  function anyHeld() { for (var k in held) { if (held[k]) return true; } return false; }

  var last = performance.now();
  function tick(t) {
    var dt = Math.min(64, t - last);
    last = t;
    if (!party && anyHeld()) {
      holdMs += dt;
      var order = [0, 1, 2];
      var done = blown;
      var need = (done + 1) * 620;
      if (done < 3 && holdMs > need) blowOut(order[done]);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  setTimeout(function () {
    Kid.speak('按住一个键，呼——把蜡烛吹灭');
  }, 900);
})();
</script>
</body>
</html>
