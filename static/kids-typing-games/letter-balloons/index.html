<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<title>🎈 字母气球</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* 气球：从屏幕底部外升起，飘到顶部外 */
  .balloon {
    position: absolute; z-index: 10; width: 84px; height: 200px;
    top: 100%;
    cursor: pointer;
    animation: floatBalloon linear forwards;
    will-change: transform;
  }
  @keyframes floatBalloon {
    from { transform: translateY(0) rotate(var(--tilt, 0deg)); }
    to   { transform: translateY(-140vh) rotate(var(--tilt, 0deg)); }
  }
  .balloon .body {
    position: absolute; left: 7px; top: 0; width: 70px; height: 88px;
    border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.85), var(--c) 42%, var(--c-dark) 100%);
    box-shadow: inset -6px -8px 12px rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: center;
  }
  .balloon .body::after {
    content: ''; position: absolute; left: 9px; top: 11px; width: 14px; height: 20px;
    background: rgba(255,255,255,.65); border-radius: 50%;
    transform: rotate(-28deg);
  }
  .balloon .letter {
    font-size: 38px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 3px rgba(0,0,0,.35); z-index: 2;
  }
  .balloon .knot {
    position: absolute; left: 31px; top: 88px; width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 14px solid var(--c-dark);
  }
  .balloon .string {
    position: absolute; left: 39px; top: 100px; width: 2px; height: 100px;
    background: rgba(255,255,255,.8);
  }
  .shake { animation: shakeX .4s; }
  @keyframes shakeX {
    0%,100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 8px)); }
    75% { transform: translateX(calc(-50% + 8px)); }
  }
  .burst {
    position: absolute; z-index: 20; pointer-events: none;
    font-size: 60px; animation: burstAnim .7s ease-out forwards;
  }
  @keyframes burstAnim {
    0% { transform: scale(.4); opacity: 1; }
    60% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  #msg { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 50;
    background: rgba(255,255,255,.95); border-radius: 22px; padding: 12px 26px;
    font-size: clamp(24px, 5vh, 40px); font-weight: 800; color: #e05a2a;
    box-shadow: 0 6px 24px rgba(31,94,150,.35); transition: opacity .3s; pointer-events: none; }
  #msg.hidden { opacity: 0; }
  .ground { position: fixed; left: 0; right: 0; bottom: 0; height: 8vh; z-index: 5;
    background: linear-gradient(#9be36b, #6fce4a); border-radius: 50% 50% 0 0 / 16% 16% 0 0; }
  /* 萌鸡小队：草地上的小鸡，蹦蹦跳跳 */
  .chick { position: fixed; bottom: 2vh; z-index: 8; font-size: clamp(38px, 8vh, 58px);
    animation: chickHop 1.6s ease-in-out infinite; pointer-events: none; }
  .chick.c2 { animation-delay: .5s; }
  .chick.c3 { animation-delay: 1s; }
  @keyframes chickHop {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-14px) rotate(5deg); }
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="ground"></div>
<div class="chick" style="left:6%">🐤</div>
<div class="chick c2" style="left:29%">🐥</div>
<div class="chick c3" style="right:7%">🐤</div>
<div class="game-area" id="area"></div>
<div id="msg" class="hidden"></div>
<div class="hud">
  <button class="btn" id="homeBtn">🏠 回家</button>
  <div class="score" id="score">🌟 0</div>
</div>
<div id="prompt">🎈 气球上是什么字母，就按什么键<small>按一样的字母键，'啵' 地戳破气球！</small></div>
<div class="overlay" id="startOv">
  <div class="big">🎈 字母气球</div>
  <button class="start-btn" id="startBtn">开 始 玩</button>
  <div class="hint">看看气球上的字母，在键盘上找到一样的字母，按下去！<br>'啵' 的一声，气球破掉，小鸡跳出来为你庆祝～<br>想戳哪个就戳哪个，随便玩！</div>
</div>
<script>
(function(){
  var area = document.getElementById('area');
  var scoreEl = document.getElementById('score');
  var promptEl = document.getElementById('prompt');
  var msgEl = document.getElementById('msg');
  var startOv = document.getElementById('startOv');
  var startBtn = document.getElementById('startBtn');
  document.getElementById('homeBtn').onclick = function(){ location.href = '../'; };

  var COLORS = [
    {c:'#ff7eb6', d:'#e04f8f'}, {c:'#ffb45e', d:'#e08a2e'}, {c:'#6fc3ff', d:'#3d8fe0'},
    {c:'#8be58b', d:'#4fbf4f'}, {c:'#c79bff', d:'#9a63e8'}, {c:'#ff8a6f', d:'#e05c3d'}
  ];
  var BALLOON_COUNT = 6;
  var score = 0, running = false, msgTimer = null, refillTimer = null;
  var balloons = [];            // 活跃气球 {el, li, slot}

  var audioCtx = null;
  function ctx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function tone(freq, dur, type, vol, delay){
    var c = ctx(); if(!c) return;
    var t = c.currentTime + (delay||0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.25, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  function popSound(){
    var c = ctx(); if(!c) return;
    var t = c.currentTime;
    var buf = c.createBuffer(1, c.sampleRate*0.18, c.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2); }
    var src = c.createBufferSource(); src.buffer = buf;
    var g = c.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.18);
    src.connect(g); g.connect(c.destination); src.start(t);
    tone(180, 0.12, 'triangle', 0.2);
  }
  function ding(){ tone(880, 0.16, 'sine', 0.25); tone(1320, 0.24, 'sine', 0.18, 0.05); }
  function wrongSound(){ tone(220, 0.16, 'sine', 0.15); }

  // 定制鼓励：叫宝宝小名（大厅家长设置可改，默认辉哥）
  var KID_NAME = '辉哥';
  try { KID_NAME = localStorage.getItem('kids_typing_name') || '辉哥'; } catch(e){}
  var PRAISE = ['太棒了', '真棒', '好厉害', '你真聪明', '好棒呀'];
  function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 0.8; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function flashMsg(txt){
    msgEl.textContent = txt; msgEl.classList.remove('hidden');
    clearTimeout(msgTimer); msgTimer = setTimeout(function(){ msgEl.classList.add('hidden'); }, 1100);
  }

  function hasBalloon(li){
    for(var i=0;i<balloons.length;i++){ if(balloons[i].li===li) return true; }
    return false;
  }
  function findBalloon(li){
    for(var i=0;i<balloons.length;i++){ if(balloons[i].li===li) return balloons[i]; }
    return null;
  }
  // 水平槽位：6 个槽各放一个气球，避免重叠
  function freeSlot(){
    var used = {};
    balloons.forEach(function(b){ used[b.slot] = true; });
    var free = [];
    for(var i=0;i<BALLOON_COUNT;i++){ if(!used[i]) free.push(i); }
    return free.length ? free[Math.floor(Math.random()*free.length)] : Math.floor(Math.random()*BALLOON_COUNT);
  }

  // 生成一个气球。scatter=true 时分散在各高度（仅开场布阵），
  // 游戏中补充的气球一律从底部自然升起，不凭空出现在屏幕中上方
  function spawnBalloon(scatter){
    // 随机挑一个屏幕上还没有的字母，保证每个字母最多一个气球
    var cands = [];
    for(var i=0;i<26;i++){ if(!hasBalloon(i)) cands.push(i); }
    if(!cands.length) return;
    var li = cands[Math.floor(Math.random()*cands.length)];
    var col = COLORS[Math.floor(Math.random()*COLORS.length)];
    var slot = freeSlot();
    var el = document.createElement('div');
    el.className = 'balloon';
    el.style.setProperty('--c', col.c);
    el.style.setProperty('--c-dark', col.d);
    el.style.setProperty('--tilt', (Math.random()*14-7) + 'deg');
    el.style.left = (slot*(100/BALLOON_COUNT) + 2 + Math.random()*4) + '%';
    var dur = (16 + Math.random()*6) * 3;   // 生命延长3倍：气球飘得慢，宝宝时间充裕
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = scatter ? (-(0.12 + Math.random()*0.55)*dur) + 's' : '0s';
    el.innerHTML = '<div class="body"><span class="letter">' + String.fromCharCode(65+li) + '</span></div><div class="knot"></div><div class="string"></div>';
    area.appendChild(el);
    var b = { el: el, li: li, slot: slot };
    balloons.push(b);
    el.addEventListener('animationend', function(){
      removeBalloon(b);
      if(running) refill();
    });
    return b;
  }
  function removeBalloon(b){
    var i = balloons.indexOf(b);
    if(i>=0) balloons.splice(i,1);
    if(b.el.parentNode) b.el.parentNode.removeChild(b.el);
  }
  // 保持气球数量（补充的从底部自然升起）
  function refill(scatter){
    if(!running) return;
    var guard = 0;
    while(balloons.length < BALLOON_COUNT && guard < 20){ spawnBalloon(scatter); guard++; }
  }
  function burst(b){
    var r = b.el.getBoundingClientRect();
    var x = r.left + r.width/2, y = r.top + 44;
    removeBalloon(b);
    var ex = document.createElement('div');
    ex.className = 'burst';
    ex.textContent = '💥';
    ex.style.left = (x-30) + 'px'; ex.style.top = (y-30) + 'px';
    area.appendChild(ex);
    setTimeout(function(){ ex.parentNode && ex.parentNode.removeChild(ex); }, 750);
    for(var i=0;i<6;i++){
      var s = document.createElement('div');
      s.className = 'spark';
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', (Math.random()*160-80)+'px');
      s.style.setProperty('--dy', (Math.random()*160-80)+'px');
      // 萌鸡小队小鸡 + 星星一起庆祝
      s.textContent = (i%2===0) ? (i%4===0 ? '🐤' : '🐥') : '✨';
      area.appendChild(s);
      (function(s){ setTimeout(function(){ s.parentNode && s.parentNode.removeChild(s); }, 950); })(s);
    }
    popSound();
  }

  // 戳破气球（键盘或点击共用）：爆炸 + 音效 + 叫名字鼓励并读出字母
  function popBalloon(b){
    var ch = String.fromCharCode(65 + b.li);
    burst(b);
    ding();
    score++; scoreEl.textContent = '🌟 ' + score;
    speak(ch + '！' + KID_NAME + '，' + praise() + '！');
    refill();
  }

  function onKey(li){
    if(!running) return;
    var b = findBalloon(li);
    if(b){
      popBalloon(b);
    } else {
      // 屏幕上没有这个字母：温和提示，不自动生成（免得宝宝找不到）
      wrongSound();
      promptEl.classList.remove('shake'); void promptEl.offsetWidth; promptEl.classList.add('shake');
      flashMsg('没有 ' + String.fromCharCode(65+li) + ' 气球哦，看看屏幕上的气球');
    }
  }

  window.addEventListener('keydown', function(e){
    if(e.repeat) return;
    var k = e.key.toUpperCase();
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(k.length===1 && k>='A' && k<='Z'){ e.preventDefault(); onKey(k.charCodeAt(0)-65); }
  });
  window.addEventListener('pointerdown', function(e){
    if(!running) return;
    var el = e.target.closest ? e.target.closest('.balloon') : null;
    if(el){
      var b = null;
      for(var i=0;i<balloons.length;i++){ if(balloons[i].el===el){ b=balloons[i]; break; } }
      if(b) popBalloon(b);
    }
  });

  startBtn.onclick = function(){
    try{ ctx().resume && ctx().resume(); }catch(e){}
    startOv.classList.add('hidden');
    running = true;
    score = 0; scoreEl.textContent = '🌟 0';
    balloons.slice().forEach(removeBalloon);
    refill(true);            // 开场一次性分散布阵
    speak('看气球上的字母，按一样的键');
    // 定时巡检：防止意外情况下气球不足
    clearInterval(refillTimer);
    refillTimer = setInterval(function(){ refill(false); }, 2500);
  };
})();
</script>
</body>
</html>
