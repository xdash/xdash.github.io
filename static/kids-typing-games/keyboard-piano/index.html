<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<title>🎹 键盘小钢琴</title>
<link rel="stylesheet" href="../style.css">
<style>
  .piano-wrap { position: fixed; left: 50%; bottom: clamp(10px, 3vh, 30px); transform: translateX(-50%); z-index: 30; }
  .piano {
    display: flex; gap: clamp(6px, 1.4vw, 14px);
    background: linear-gradient(#5a4a6e, #3d3150);
    border-radius: clamp(18px, 3vh, 28px);
    padding: clamp(12px, 2.4vh, 22px);
    box-shadow: 0 10px 0 #2a2138, 0 18px 30px rgba(20,40,90,.45);
  }
  .key {
    width: clamp(46px, 9.5vw, 84px); height: clamp(150px, 36vh, 260px);
    background: linear-gradient(#fff 0%, #f2f2f2 82%, #dfdfdf 100%);
    border-radius: 10px 10px 12px 12px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.12), inset -4px 0 8px rgba(0,0,0,.06);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 14px; gap: 6px;
    cursor: pointer; transition: transform .06s, background .1s;
    color: #9aa7b8; font-weight: 800;
    user-select: none; -webkit-user-select: none;
  }
  .key .k { font-size: clamp(18px, 3.4vh, 26px); }
  .key .note { font-size: clamp(12px, 2.2vh, 16px); }
  .key.lit {
    background: linear-gradient(var(--glow) 0%, var(--glow) 72%, var(--glow-dark) 100%);
    color: #fff; transform: translateY(4px);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), 0 0 26px var(--glow);
  }
  .note-float {
    position: absolute; z-index: 40; pointer-events: none;
    font-size: clamp(26px, 6vh, 44px);
    animation: noteUp 1.1s ease-out forwards;
  }
  @keyframes noteUp {
    0% { transform: translateY(0) scale(.6); opacity: 1; }
    100% { transform: translateY(-70vh) scale(1.3) rotate(14deg); opacity: 0; }
  }
  .demo-btn {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: clamp(250px, 46vh, 420px); z-index: 30;
    background: #ff9a3d; color: #fff; border: none; border-radius: 30px;
    padding: 10px 26px; font-size: clamp(16px, 3vh, 22px); font-weight: 800;
    box-shadow: 0 4px 0 #c96a12, 0 8px 18px rgba(20,60,110,.35); cursor: pointer;
  }
  .demo-btn:active { transform: translateX(-50%) translateY(3px); }
  .demo-btn.playing { background: #7cc0ff; box-shadow: 0 4px 0 #3d8fe0; }
</style>
</head>
<body>
<div class="sky"></div>
<div class="game-area" id="area"></div>
<button class="demo-btn" id="demoBtn">⭐ 听小星星</button>
<div class="hud">
  <button class="btn" id="homeBtn">🏠 回家</button>
  <div class="score" id="score">🎼 叮叮咚咚</div>
</div>
<div class="piano-wrap">
  <div class="piano" id="piano"></div>
</div>
<div class="overlay" id="startOv">
  <div class="big">🎹 键盘小钢琴</div>
  <button class="start-btn" id="startBtn">开 始 玩</button>
  <div class="hint">键盘上的 Q W E R T Y U 就是琴键！<br>随便按，叮叮咚咚真好听～<br>也可以点点屏幕上的琴键哦！</div>
</div>
<script>
(function(){
  var area = document.getElementById('area');
  var pianoEl = document.getElementById('piano');
  var startOv = document.getElementById('startOv');
  var startBtn = document.getElementById('startBtn');
  var demoBtn = document.getElementById('demoBtn');
  document.getElementById('homeBtn').onclick = function(){ location.href='../'; };

  // Q W E R T Y U → C D E F G A B（C 大调）
  var KEYS = [
    { key:'Q', note:'C',  freq:261.63, c:'#ff6b81', dark:'#d64557' },
    { key:'W', note:'D',  freq:293.66, c:'#ffa94d', dark:'#e0831f' },
    { key:'E', note:'E',  freq:329.63, c:'#ffe14d', dark:'#d9b72a' },
    { key:'R', note:'F',  freq:349.23, c:'#8ce05e', dark:'#5cae35' },
    { key:'T', note:'G',  freq:392.00, c:'#4dc7ff', dark:'#1f9ad4' },
    { key:'Y', note:'A',  freq:440.00, c:'#7a7dff', dark:'#4f52d9' },
    { key:'U', note:'B',  freq:493.88, c:'#c97fff', dark:'#9c4fe0' }
  ];
  var FREQ = { C:261.63, D:293.66, E:329.63, F:349.23, G:392.00, A:440.00, B:493.88, C5:523.25 };
  var keyEls = {};
  var running = false, demoOn = false, demoQueue = [], demoTimer = null;
  var audioCtx = null;
  function ctx(){ if(!audioCtx){ try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }

  function tone(freq, dur, type, vol){
    var c=ctx(); if(!c) return;
    var t=c.currentTime;
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'triangle';
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    // 钢琴感：加一个泛音
    var o2=c.createOscillator(), g2=c.createGain();
    o2.type='sine'; o2.frequency.value=freq*2;
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.exponentialRampToValueAtTime((vol||0.3)*0.25,t+0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.7);
    o.connect(g); g.connect(c.destination);
    o2.connect(g2); g2.connect(c.destination);
    o.start(t); o.stop(t+dur+0.05);
    o2.start(t); o2.stop(t+dur*0.7+0.05);
  }

  // 渲染琴键
  KEYS.forEach(function(k, i){
    var el = document.createElement('div');
    el.className = 'key';
    el.style.setProperty('--glow', k.c);
    el.style.setProperty('--glow-dark', k.dark);
    el.innerHTML = '<span class="k">'+k.key+'</span><span class="note">'+k.note+'</span>';
    el.addEventListener('pointerdown', function(ev){ ev.preventDefault(); playKey(i); });
    pianoEl.appendChild(el);
    keyEls[i] = el;
  });

  function playKey(i){
    if(!running) return;
    var k = KEYS[i];
    tone(k.freq, 0.7, 'triangle', 0.3);
    // 琴键亮
    keyEls[i].classList.add('lit');
    setTimeout(function(){ keyEls[i].classList.remove('lit'); }, 180);
    // 音符飘起
    var notes = ['♪','♫','♩','♬','🎵','🎶'];
    var n = document.createElement('div');
    n.className = 'note-float';
    n.textContent = notes[Math.floor(Math.random()*notes.length)];
    n.style.left = (10 + Math.random()*75) + '%';
    n.style.top = '55%';
    n.style.color = k.c;
    area.appendChild(n);
    setTimeout(function(){ n.parentNode && n.parentNode.removeChild(n); }, 1150);
  }

  // 小星星旋律（C C G G A A G / F F E E D D C / G G F F E E D / G G F F E E D / C C G G A A G / F F E E D D C）
  var STAR = [
    ['C',0],['C',0],['G',0],['G',0],['A',0],['A',0],['G',1],
    ['F',0],['F',0],['E',0],['E',0],['D',0],['D',0],['C',1],
    ['G',0],['G',0],['F',0],['F',0],['E',0],['E',0],['D',1],
    ['G',0],['G',0],['F',0],['F',0],['E',0],['E',0],['D',1],
    ['C',0],['C',0],['G',0],['G',0],['A',0],['A',0],['G',1],
    ['F',0],['F',0],['E',0],['E',0],['D',0],['D',0],['C',2]
  ];
  function noteToKeyIdx(note){
    for(var i=0;i<KEYS.length;i++){ if(KEYS[i].note===note) return i; }
    return -1;
  }
  function stopStar(){
    demoQueue.forEach(clearTimeout);
    demoQueue = [];
    clearTimeout(demoTimer);
    demoOn = false;
    demoBtn.classList.remove('playing');
    demoBtn.textContent = '⭐ 听小星星';
  }
  function playStar(){
    if(demoOn){ stopStar(); return; }   // 播放中再点 = 停止
    demoOn = true;
    demoBtn.classList.add('playing');
    demoBtn.textContent = '⏹ 停止';
    var t = 0;
    STAR.forEach(function(step){
      var idx = noteToKeyIdx(step[0]);
      var dur = (step[1]===2) ? 1.0 : (step[1]===1 ? 0.55 : 0.3);
      var id = setTimeout(function(){
        if(idx>=0 && demoOn){ playKey(idx); }
      }, t*1000);
      demoQueue.push(id);
      t += dur;
    });
    clearTimeout(demoTimer);
    demoTimer = setTimeout(stopStar, t*1000 + 200);
  }
  demoBtn.onclick = function(){ if(running) playStar(); };

  window.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k = e.key.toUpperCase();
    for(var i=0;i<KEYS.length;i++){
      if(KEYS[i].key===k){ e.preventDefault(); playKey(i); return; }
    }
  });

  startBtn.onclick = function(){
    try{ ctx().resume && ctx().resume(); }catch(e){}
    startOv.classList.add('hidden');
    running = true;
  };
})();
</script>
</body>
</html>
