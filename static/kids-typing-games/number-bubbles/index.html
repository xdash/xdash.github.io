<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<title>🔢 数字积木</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* 积木：从水底升起，飘到顶部外 */
  .bubble {
    position: absolute; z-index: 10;
    top: 100%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), var(--c) 45%, var(--c-dark) 100%);
    box-shadow: inset -6px -8px 14px rgba(0,0,0,.14), 0 6px 16px rgba(31,94,150,.28);
    display: flex; align-items: center; justify-content: center;
    animation: bubbleFloat linear forwards;
    will-change: transform;
    cursor: pointer;
  }
  .bubble::before {
    content: ''; position: absolute; left: 22%; top: 16%; width: 22%; height: 26%;
    background: rgba(255,255,255,.8); border-radius: 50%; transform: rotate(-30deg);
  }
  .bubble .num {
    font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.4);
    z-index: 2;
  }
  @keyframes bubbleFloat {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-140vh) scale(1.02); }
  }
  /* 数字积木（NumberBlocks）：圆角方块 + 大眼睛 + 微笑 */
  .bubble.block { border-radius: 24%; }
  .bubble .eyes { position: absolute; top: 14%; left: 0; right: 0;
    display: flex; justify-content: center; gap: 14%; z-index: 2; }
  .bubble .eyes i { width: 19%; aspect-ratio: 1; background: #fff; border-radius: 50%;
    position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .bubble .eyes i::after { content: ''; position: absolute; left: 28%; top: 34%;
    width: 46%; height: 46%; background: #222; border-radius: 50%; }
  .bubble .num { color: var(--ink, #fff); margin-top: 22%; z-index: 2; }
  .bubble .mouth { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
    width: 32%; height: 15%; border: 4px solid var(--ink, #fff); border-top: none;
    border-radius: 0 0 40px 40px; z-index: 2; opacity: .9; }
  .pop-wave { position: absolute; z-index: 15; pointer-events: none;
    border-radius: 50%; animation: popWave .5s ease-out forwards; }
  @keyframes popWave {
    from { transform: scale(.3); opacity: 1; }
    to { transform: scale(1.6); opacity: 0; }
  }
  .water { position: fixed; left: 0; right: 0; bottom: 0; height: 16vh; z-index: 5;
    background: linear-gradient(#79c9f5, #4aa8e8); border-radius: 48% 52% 0 0 / 26% 30% 0 0; }
  /* 鱼：🐠🐟 emoji 头朝左，从右往左游 = 正向；固定在水层里 */
  .fish { position: absolute; z-index: 6; font-size: clamp(24px, 6vh, 46px);
    left: 110%; bottom: 3vh; animation: fishSwim linear infinite; animation-delay: -6s; }
  .fish.f2 { font-size: clamp(18px,4.5vh,34px); bottom: 8vh; animation-duration: 26s; animation-delay: -16s; }
  @keyframes fishSwim {
    from { transform: translateX(0) scaleX(1); }
    to   { transform: translateX(-135vw) scaleX(1); }
  }
  #goalBox {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: clamp(64px, 12vh, 110px); z-index: 40;
    background: rgba(255,255,255,.9); border-radius: 26px; padding: 12px 24px;
    font-size: clamp(18px, 3.6vh, 28px); font-weight: 800; color: #1d4e8f;
    box-shadow: 0 4px 18px rgba(31,94,150,.3);
    display: flex; align-items: center; gap: 12px;
  }
  #goalBox small { font-size: .6em; color: #6b93bb; font-weight: 600; }
  #goalBox.shake { animation: goalShake .4s; }
  @keyframes goalShake {
    0%,100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 10px)); }
    75% { transform: translateX(calc(-50% + 10px)); }
  }
  #msg { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 50;
    background: rgba(255,255,255,.95); border-radius: 22px; padding: 12px 26px;
    font-size: clamp(24px, 5vh, 40px); font-weight: 800; color: #e05a2a;
    box-shadow: 0 6px 24px rgba(31,94,150,.35); transition: opacity .3s; pointer-events: none; }
  #msg.hidden { opacity: 0; }
</style>
</head>
<body>
<div class="sky"></div>
<div class="water"></div>
<div class="fish">🐠</div>
<div class="fish f2">🐟</div>
<div class="game-area" id="area"></div>
<div id="msg" class="hidden"></div>
<div class="hud">
  <button class="btn" id="homeBtn">🏠 回家</button>
  <div class="score" id="score">🌟 0</div>
</div>
<div id="goalBox">🔢 积木上是什么数字，就按什么键<small>按一样的数字键，'啵'！</small></div>
<div class="overlay" id="startOv">
  <div class="big">🔢 数字积木</div>
  <button class="start-btn" id="startBtn">开 始 玩</button>
  <div class="hint">数字积木（NumberBlocks）从水里冒出来啦！<br>积木上是什么数字，就在键盘上按什么数字！<br>'啵' 的一声戳破它，想戳哪个就戳哪个～</div>
</div>
<script>
(function(){
  var area = document.getElementById('area');
  var scoreEl = document.getElementById('score');
  var goalBox = document.getElementById('goalBox');
  var msgEl = document.getElementById('msg');
  var startOv = document.getElementById('startOv');
  var startBtn = document.getElementById('startBtn');
  document.getElementById('homeBtn').onclick = function(){ location.href='../'; };

  var NUMBERS = [1,2,3,4,5];
  var COLORS = {
    1:{c:'#ff6b6b',d:'#d64545',ink:'#fff'},    // One 红
    2:{c:'#ffb45e',d:'#e08a2e',ink:'#fff'},    // Two 橙
    3:{c:'#ffe14d',d:'#e0b62a',ink:'#8a6d00'}, // Three 黄（深棕字）
    4:{c:'#8be58b',d:'#4fbf4f',ink:'#fff'},    // Four 绿
    5:{c:'#6fc3ff',d:'#3d8fe0',ink:'#fff'}     // Five 蓝
  };
  var BUBBLE_COUNT = 5;
  var score=0, running=false, msgTimer=null, refillTimer=null;
  var bubbles=[];
  var audioCtx=null;
  function ctx(){ if(!audioCtx){ try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function tone(f,d,tp,v,dl){ var c=ctx(); if(!c)return; var tt=c.currentTime+(dl||0); var o=c.createOscillator(),g=c.createGain(); o.type=tp||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(v||0.25,tt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,tt+d); o.connect(g); g.connect(c.destination); o.start(tt); o.stop(tt+d+0.05); }
  function popSound(){ var c=ctx(); if(!c)return; var t=c.currentTime; var b=c.createBuffer(1,c.sampleRate*0.16,c.sampleRate); var d=b.getChannelData(0); for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);} var s=c.createBufferSource(); s.buffer=b; var g=c.createGain(); g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); s.connect(g); g.connect(c.destination); s.start(t); }
  function ding(){ tone(980,0.14,'sine',0.25); tone(1470,0.22,'sine',0.16,0.05); }
  function wrongSound(){ tone(220,0.16,'sine',0.15); }
  // 定制鼓励：叫宝宝小名（大厅家长设置可改，默认辉哥）
  var KID_NAME = '辉哥';
  try { KID_NAME = localStorage.getItem('kids_typing_name') || '辉哥'; } catch(e){}
  var PRAISE = ['太棒了', '真棒', '好厉害', '你真聪明', '好棒呀'];
  function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }
  function speak(t){ try{ if(!('speechSynthesis' in window))return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=0.75; u.pitch=1.3; window.speechSynthesis.speak(u);}catch(e){} }
  function flashMsg(txt){ msgEl.textContent=txt; msgEl.classList.remove('hidden'); clearTimeout(msgTimer); msgTimer=setTimeout(function(){ msgEl.classList.add('hidden'); },1100); }

  function findBubble(n){ for(var i=0;i<bubbles.length;i++){ if(bubbles[i].num===n) return bubbles[i]; } return null; }
  function freeSlot(){
    var used={};
    bubbles.forEach(function(b){ used[b.slot]=true; });
    var free=[];
    for(var i=0;i<BUBBLE_COUNT;i++){ if(!used[i]) free.push(i); }
    return free.length ? free[Math.floor(Math.random()*free.length)] : Math.floor(Math.random()*BUBBLE_COUNT);
  }

  // 生成一个积木：随机挑屏幕上还没有的数字，1-5 每种最多一个
  // scatter 仅开场布阵分散高度；游戏中补充的积木从底部自然升起，不凭空出现
  function spawn(scatter){
    var cands=[];
    for(var i=0;i<NUMBERS.length;i++){ var n=NUMBERS[i]; if(!findBubble(n)) cands.push(n); }
    if(!cands.length) return;
    var num=cands[Math.floor(Math.random()*cands.length)];
    var size = 92 + Math.random()*28;
    var col = COLORS[num];
    var slot = freeSlot();
    var el = document.createElement('div');
    el.className='bubble block';
    el.style.width=size+'px'; el.style.height=size+'px';
    el.style.setProperty('--c',col.c); el.style.setProperty('--c-dark',col.d);
    el.style.setProperty('--ink',col.ink);
    el.style.left=(slot*(100/BUBBLE_COUNT)+2+Math.random()*4)+'%';
    var dur=(15+Math.random()*5)*3;   // 生命延长3倍：积木慢慢飘，宝宝时间充裕
    var delay=(0.12+Math.random()*0.55)*dur;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = scatter ? (-delay)+'s' : '0s';
    el.style.fontSize=(size*0.34)+'px';
    // 数字积木：两只大眼睛 + 数字 + 微笑
    el.innerHTML='<div class="eyes"><i></i><i></i></div><span class="num">'+num+'</span><div class="mouth"></div>';
    area.appendChild(el);
    var b={el:el,num:num,slot:slot};
    bubbles.push(b);
    el.addEventListener('animationend',function(){
      removeB(b);
      if(running) refill();
    });
    return b;
  }
  function removeB(b){ var i=bubbles.indexOf(b); if(i>=0)bubbles.splice(i,1); if(b.el.parentNode)b.el.parentNode.removeChild(b.el); }
  // 保持积木数量（补充的从底部自然升起）
  function refill(scatter){
    if(!running) return;
    var guard=0;
    while(bubbles.length<BUBBLE_COUNT && guard<20){ spawn(scatter); guard++; }
  }
  function pop(b){
    var r=b.el.getBoundingClientRect();
    var x=r.left+r.width/2, y=r.top+r.height/2;
    removeB(b);
    var w=document.createElement('div'); w.className='pop-wave';
    w.style.left=(x-40)+'px'; w.style.top=(y-40)+'px';
    w.style.width='80px'; w.style.height='80px';
    w.style.background='radial-gradient(circle, rgba(255,255,255,.95), transparent 70%)';
    area.appendChild(w); setTimeout(function(){ w.parentNode&&w.parentNode.removeChild(w); },520);
    for(var i=0;i<5;i++){
      var s=document.createElement('div'); s.className='spark';
      s.style.left=x+'px'; s.style.top=y+'px';
      s.style.setProperty('--dx',(Math.random()*140-70)+'px'); s.style.setProperty('--dy',(Math.random()*140-70)+'px');
      s.textContent='✨'; area.appendChild(s);
      (function(s){ setTimeout(function(){ s.parentNode&&s.parentNode.removeChild(s); },950); })(s);
    }
    popSound();
  }

  // 戳破积木（键盘或点击共用）：爆炸 + 音效 + 叫名字鼓励并读出数字
  function popBubble(b){
    pop(b);
    ding();
    score++; scoreEl.textContent='🌟 '+score;
    speak(b.num + '！' + KID_NAME + '，' + praise() + '！');
    refill();
  }

  function onNum(n){
    if(!running) return;
    var b = findBubble(n);
    if(b){ popBubble(b); }
    else {
      // 屏幕上没有这个数字：温和提示，不自动生成（免得宝宝找不到）
      wrongSound();
      goalBox.classList.remove('shake'); void goalBox.offsetWidth; goalBox.classList.add('shake');
      flashMsg('没有 ' + n + ' 积木哦，看看屏幕上的积木');
    }
  }

  window.addEventListener('keydown',function(e){
    if(e.repeat) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var n=parseInt(e.key,10);
    if(!isNaN(n) && n>=1 && n<=5){ e.preventDefault(); onNum(n); }
  });
  window.addEventListener('pointerdown',function(e){
    if(!running) return;
    var el=e.target.closest?e.target.closest('.bubble'):null;
    if(el){ var b=null; for(var i=0;i<bubbles.length;i++){ if(bubbles[i].el===el){b=bubbles[i];break;} }
      if(b) popBubble(b); }
  });

  startBtn.onclick=function(){
    try{ ctx().resume&&ctx().resume(); }catch(e){}
    startOv.classList.add('hidden');
    running=true; score=0;
    scoreEl.textContent='🌟 0';
    bubbles.slice().forEach(removeB);
    refill(true);
    speak('看积木上的数字，按一样的键');
    clearInterval(refillTimer);
    refillTimer=setInterval(function(){ refill(false); },2500);
  };
})();
</script>
</body>
</html>
