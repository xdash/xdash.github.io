<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕷️</text></svg>">
<title>🕷️ 蜘蛛小英雄</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { background: linear-gradient(180deg, #0b1035 0%, #1b2a6b 45%, #3a4f9e 100%); }
  .sky { background: radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,.8), transparent),
    radial-gradient(3px 3px at 34% 12%, rgba(255,255,255,.6), transparent),
    radial-gradient(2px 2px at 58% 30%, rgba(255,255,255,.8), transparent),
    radial-gradient(3px 3px at 78% 16%, rgba(255,255,255,.6), transparent),
    radial-gradient(2px 2px at 92% 40%, rgba(255,255,255,.7), transparent),
    radial-gradient(2px 2px at 22% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(3px 3px at 66% 70%, rgba(255,255,255,.6), transparent),
    radial-gradient(2px 2px at 46% 84%, rgba(255,255,255,.5), transparent); }
  .planet { position: absolute; z-index: 2; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffd9a0, #d98a4a 55%, #a85f2e);
    box-shadow: inset -10px -12px 20px rgba(0,0,0,.35); }
  .planet.ring { box-shadow: inset -10px -12px 20px rgba(0,0,0,.35), 0 0 0 6px rgba(255,214,150,.35), 0 0 0 12px rgba(255,214,150,.18); }
  /* 星星：从顶部往下掉 */
  .star { position: absolute; z-index: 10; top: -8vh;
    font-size: clamp(40px, 8vh, 60px);
    animation: starFall linear forwards; will-change: transform;
    filter: drop-shadow(0 0 8px rgba(255,240,160,.8)); cursor: pointer; }
  @keyframes starFall { from { transform: translateY(0); } to { transform: translateY(120vh); } }
  .star .letter {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
    font-size: .5em; color: #fff; font-weight: 900; text-shadow: 0 0 8px rgba(0,0,0,.7);
  }
  /* Q 版蜘蛛小英雄：可以左右移动去追星星 */
  .rocket {
    position: fixed; left: 50%; bottom: clamp(40px, 9vh, 80px); z-index: 30;
    transition: left .3s cubic-bezier(.3,1.2,.4,1);
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.4));
    transform: translateX(-50%);
  }
  .hero-svg { width: clamp(64px, 15vh, 104px); height: auto; display: block; }
  /* 蛛丝 */
  .webline { position: fixed; z-index: 28; height: 3px;
    background: rgba(255,255,255,.92); box-shadow: 0 0 6px rgba(255,255,255,.8);
    transform-origin: 0 50%; pointer-events: none;
    animation: webFade .45s ease-out forwards; }
  @keyframes webFade { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .rocket.thrust { animation: thrust .18s; }
  @keyframes thrust { 0%{ transform: translateX(-50%) translateY(0) scale(1);} 50%{ transform: translateX(-50%) translateY(6px) scale(1.08);} 100%{ transform: translateX(-50%) translateY(0) scale(1);} }
  .rocket.boost { animation: boost .5s ease-out; }
  @keyframes boost {
    0% { transform: translateX(-50%) translateY(0) scale(1); }
    40% { transform: translateX(-50%) translateY(-46vh) scale(1.15); }
    100% { transform: translateX(-50%) translateY(0) scale(1); }
  }
  .beam {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: clamp(36px,8vh,70px); width: 130px; height: 40vh; z-index: 25;
    background: linear-gradient(transparent, rgba(150,230,255,.28), rgba(150,230,255,.55));
    clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
    pointer-events: none; opacity: .7;
  }
  #prompt { bottom: auto; top: clamp(64px, 10vh, 100px); }
</style>
</head>
<body>
<div class="sky"></div>
<div class="planet" style="width:90px;height:90px;right:6%;top:8%;"></div>
<div class="planet ring" style="width:56px;height:56px;left:8%;top:34%;"></div>
<div class="beam" id="beam"></div>
<div class="game-area" id="area"></div>
<div class="rocket" id="rocket">
  <svg viewBox="0 0 100 122" class="hero-svg" aria-hidden="true">
    <rect x="31" y="72" width="38" height="42" rx="13" fill="#2b5fb0"/>
    <rect x="31" y="72" width="38" height="15" rx="7" fill="#d23c3c"/>
    <circle cx="22" cy="84" r="8" fill="#d23c3c"/>
    <circle cx="78" cy="84" r="8" fill="#d23c3c"/>
    <circle cx="50" cy="42" r="34" fill="#d23c3c"/>
    <g stroke="rgba(255,255,255,.38)" stroke-width="1.3" fill="none">
      <path d="M50 9 V75 M17 42 H83 M27 19 L73 65 M73 19 L27 65"/>
      <circle cx="50" cy="42" r="22"/>
    </g>
    <ellipse cx="36" cy="45" rx="10.5" ry="14" fill="#fff" stroke="#222" stroke-width="3.2" transform="rotate(-18 36 45)"/>
    <ellipse cx="64" cy="45" rx="10.5" ry="14" fill="#fff" stroke="#222" stroke-width="3.2" transform="rotate(18 64 45)"/>
  </svg>
</div>
<div class="hud">
  <button class="btn" id="homeBtn">🏠 回家</button>
  <div class="score" id="score">⭐ 0</div>
</div>
<div id="prompt">⭐ 字母星星掉下来啦！<small>按键盘上的字母，蜘蛛小英雄发射蛛丝抓星星！</small></div>
<div class="overlay" id="startOv">
  <div class="big">🕷️ 蜘蛛小英雄</div>
  <button class="start-btn" id="startBtn">发 射</button>
  <div class="hint">字母星星一颗颗掉下来，<br>按出星星上的字母，蜘蛛小英雄就发射蛛丝抓住它！<br>抓得越多越厉害！</div>
</div>
<script>
(function(){
  var area=document.getElementById('area');
  var rocket=document.getElementById('rocket');
  var beam=document.getElementById('beam');
  var scoreEl=document.getElementById('score');
  var promptEl=document.getElementById('prompt');
  var startOv=document.getElementById('startOv');
  var startBtn=document.getElementById('startBtn');
  document.getElementById('homeBtn').onclick=function(){ location.href='../'; };

  var score=0, running=false, spawnTimer=null, promptTimer=null;
  var stars=[];
  var audioCtx=null;
  function ctx(){ if(!audioCtx){ try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function tone(f,d,tp,v,dl){ var c=ctx(); if(!c)return; var t=c.currentTime+(dl||0); var o=c.createOscillator(),g=c.createGain(); o.type=tp||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05); }
  function whoosh(){ tone(300,0.3,'sawtooth',0.12); tone(900,0.25,'sine',0.15,0.06); }
  function ding(){ tone(980,0.14,'sine',0.28); tone(1470,0.2,'sine',0.18,0.06); }
  function wrongSound(){ tone(220,0.16,'sine',0.15); }

  function hasStar(li){ for(var i=0;i<stars.length;i++){ if(stars[i].li===li) return true; } return false; }
  function findStar(li){ for(var i=0;i<stars.length;i++){ if(stars[i].li===li) return stars[i]; } return null; }

  function spawnStar(forceLetter){
    var li;
    if(forceLetter!==undefined){ li=forceLetter; }
    else {
      var cands=[];
      for(var i=0;i<26;i++){ if(!hasStar(i)) cands.push(i); }
      if(!cands.length) return;
      li=cands[Math.floor(Math.random()*cands.length)];
    }
    var el=document.createElement('div');
    el.className='star';
    var L=String.fromCharCode(65+li);
    el.innerHTML='⭐<span class="letter">'+L+'</span>';
    el.style.left=(5+Math.random()*85)+'%';
    el.style.animationDuration=(9+Math.random()*4)+'s';
    area.appendChild(el);
    var s={el:el,li:li};
    stars.push(s);
    el.addEventListener('animationend',function(){ removeStar(s); });
    return s;
  }
  function removeStar(s){
    var i=stars.indexOf(s); if(i>=0) stars.splice(i,1);
    if(s.el.parentNode) s.el.parentNode.removeChild(s.el);
  }
  function flashPrompt(html){
    promptEl.innerHTML=html;
    clearTimeout(promptTimer);
    promptTimer=setTimeout(function(){
      promptEl.innerHTML='⭐ 字母星星掉下来啦！<small>按键盘上的字母，蜘蛛小英雄发射蛛丝抓星星！</small>';
    },1600);
  }

  function shootWeb(x, y){
    var rr = rocket.getBoundingClientRect();
    var hx = rr.left + rr.width/2, hy = rr.top + rr.height/2;
    var dx = x-hx, dy = y-hy;
    var len = Math.sqrt(dx*dx+dy*dy);
    var ang = Math.atan2(dy,dx)*180/Math.PI;
    var web = document.createElement('div');
    web.className = 'webline';
    web.style.left = hx+'px'; web.style.top = hy+'px';
    web.style.width = len+'px';
    web.style.transform = 'rotate('+ang+'deg)';
    area.appendChild(web);
    setTimeout(function(){ web.parentNode && web.parentNode.removeChild(web); }, 460);
  }

  function collect(s){
    var r=s.el.getBoundingClientRect();
    var x=r.left+r.width/2, y=r.top+r.height/2;
    removeStar(s);
    // 蜘蛛小英雄先水平移到星星下方，发射蛛丝，再加速上冲
    rocket.style.left = x+'px';
    beam.style.left = x+'px';
    shootWeb(x, y);
    rocket.classList.remove('boost'); void rocket.offsetWidth; rocket.classList.add('boost');
    for(var i=0;i<6;i++){
      var sp=document.createElement('div'); sp.className='spark';
      sp.style.left=x+'px'; sp.style.top=y+'px';
      sp.style.setProperty('--dx',(Math.random()*140-70)+'px'); sp.style.setProperty('--dy',(Math.random()*140-70)+'px');
      sp.textContent='✨'; area.appendChild(sp);
      (function(sp){ setTimeout(function(){ sp.parentNode&&sp.parentNode.removeChild(sp); },950); })(sp);
    }
    ding(); whoosh();
    score++; scoreEl.textContent='⭐ '+score;
    flashPrompt('抓到 '+String.fromCharCode(65+s.li)+' 啦！🎉<small>继续抓下一颗星星</small>');
  }

  function onLetter(li){
    if(!running) return;
    var s=findStar(li);
    if(s){ collect(s); }
    else {
      wrongSound();
      rocket.classList.remove('thrust'); void rocket.offsetWidth; rocket.classList.add('thrust');
      spawnStar(li);
      flashPrompt(String.fromCharCode(65+li)+' 星星来了，再按一次！<small>按字母键抓星星</small>');
    }
  }

  window.addEventListener('keydown',function(e){
    if(e.repeat) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key.toUpperCase();
    if(k.length===1 && k>='A' && k<='Z'){ e.preventDefault(); onLetter(k.charCodeAt(0)-65); }
  });
  window.addEventListener('pointerdown',function(e){
    if(!running) return;
    var el=e.target.closest?e.target.closest('.star'):null;
    if(el){ var s=null; for(var i=0;i<stars.length;i++){ if(stars[i].el===el){s=stars[i];break;} }
      if(s) collect(s); }
  });

  startBtn.onclick=function(){
    try{ ctx().resume&&ctx().resume(); }catch(e){}
    startOv.classList.add('hidden');
    running=true; score=0; scoreEl.textContent='⭐ 0';
    rocket.style.left='50%'; beam.style.left='50%';
    stars.slice().forEach(removeStar);
    clearInterval(spawnTimer);
    for(var i=0;i<5;i++) spawnStar();
    spawnTimer=setInterval(function(){
      if(!running){ clearInterval(spawnTimer); return; }
      if(stars.length<7) spawnStar();
    }, 2200);
  };
})();
</script>
</body>
</html>
