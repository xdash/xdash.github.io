<script>
/* 轻量 markdown 渲染（标题/粗体/列表/代码块/链接/换行），与 notification_center 同款 */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function miniMd(s){
  let h = esc(s);
  h = h.replace(/```([\s\S]*?)```/g, (m,c)=>'<pre>'+c+'</pre>');
  h = h.replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\[([^\]]*)\]\((https?:[^)\s"'<>]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/^[-*] (.*)$/gm,'• $1');
  h = h.replace(/^---$/gm,'<hr>');
  return h.replace(/\n/g,'<br>');
}
async function renderMarkdown(root){
  root.querySelectorAll('.body[data-md]').forEach(el=>{
    el.innerHTML = miniMd(el.dataset.md);
  });
}

const viewFeed = document.getElementById('view-feed');
const viewSh = document.getElementById('view-sh');
const viewXrank = document.getElementById('view-xrank');
const viewPos = document.getElementById('view-pos');
const viewUsage = document.getElementById('view-usage');
const loadmore = document.getElementById('loadmore');
const dayIndex = JSON.parse(viewFeed.dataset.days);
const days = dayIndex.map(item=>item.day);
const dayCounts = Object.fromEntries(dayIndex.map(item=>[item.day, item.count]));
const sections = {};
const dayRequests = {};
const tabRequests = {};
const tabViews = { sh: viewSh, xrank: viewXrank, pos: viewPos, usage: viewUsage };
const tabPaths = { sh: 'shanghai.html', xrank: 'xrank.html', pos: 'portfolio.html', usage: 'usage.html' };
viewFeed.querySelectorAll('.day[data-day]').forEach(el=>{ sections[el.dataset.day] = el; });

async function loadDay(day){
  if (sections[day]) return sections[day];
  if (dayRequests[day]) return dayRequests[day];
  const request = (async()=>{
    const response = await fetch('fragments/feed/' + day + '.html');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const template = document.createElement('template');
    template.innerHTML = await response.text();
    const section = template.content.querySelector('.day[data-day]');
    if (!section) throw new Error('Invalid day fragment');
    const index = days.indexOf(day);
    let before = loadmore;
    for (let i = index + 1; i < days.length; i++) {
      if (sections[days[i]]) { before = sections[days[i]]; break; }
    }
    viewFeed.insertBefore(section, before);
    await renderMarkdown(section);
    sections[day] = section;
    return section;
  })();
  dayRequests[day] = request;
  try { return await request; }
  finally { delete dayRequests[day]; }
}

async function loadTab(name){
  if (name === 'feed') return viewFeed;
  const view = tabViews[name];
  if (!view) throw new Error('Unknown tab');
  if (view.dataset.loaded === 'true') return view;
  if (tabRequests[name]) return tabRequests[name];
  const request = (async()=>{
    const response = await fetch('fragments/' + tabPaths[name]);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    view.innerHTML = await response.text();
    await renderMarkdown(view);
    view.dataset.loaded = 'true';
    return view;
  })();
  tabRequests[name] = request;
  try { return await request; }
  finally { delete tabRequests[name]; }
}

/* 瀑布流：首页保留最新 3 天，更早内容按需请求静态分片 */
(async function(){
  const PAGE = 3;
  const today = '2026-11-12';
  let shown = Math.min(1, days.length);  // 只有内联天数已在 DOM，其余都走分片
  function applyShown(){
    const left = days.length - shown;
    loadmore.classList.toggle('hidden', left <= 0);
    if (left > 0) loadmore.textContent = '加载更早 ' + Math.min(PAGE, left) + ' 天';
  }
  loadmore.addEventListener('click', async()=>{
    if (loadmore.disabled) return;
    loadmore.disabled = true;
    try {
      for (const day of days.slice(shown, shown + PAGE)) {
        await loadDay(day);
        shown++;
      }
      applyShown();
      fabUpdate();
    } catch (error) {
      loadmore.textContent = '加载失败，点击重试';
    } finally {
      loadmore.disabled = false;
    }
  });

  /* ‹ › 在完整日期序列（含空白天）里移动，需要时先加载目标日期 */
  let idx = 0;
  const curDate = document.getElementById('cur-date');
  const curCount = document.getElementById('cur-count');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const todayBtn = document.getElementById('today-btn');
  let navigationOperation = 0;
  async function show(scroll){
    const operation = ++navigationOperation;
    const d = days[idx];
    curDate.textContent = (d === today ? '今天 ' : '') + d;
    curCount.textContent = dayCounts[d] + ' 条';
    prev.disabled = true;
    next.disabled = true;
    try {
      const section = await loadDay(d);
      if (operation !== navigationOperation) return;
      if (scroll) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#d-' + d);
      }
    } catch (error) {
      if (operation !== navigationOperation) return;
      const retry = document.createElement('button');
      retry.id = 'day-retry';
      retry.textContent = '加载失败，点击重试';
      retry.addEventListener('click', ()=>show(true));
      curCount.replaceChildren(retry);
    } finally {
      if (operation !== navigationOperation) return;
      prev.disabled = idx >= days.length - 1;
      next.disabled = idx <= 0;
      todayBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
    }
  }
  prev.addEventListener('click', ()=>{ if (idx < days.length-1) { idx++; show(true); } });
  next.addEventListener('click', ()=>{ if (idx > 0) { idx--; show(true); } });
  todayBtn.addEventListener('click', ()=>{ idx = 0; show(true); });

  /* tab 切换：信息流 / 上海 / X 涨粉 / 行情 / 用量；加载成功后再显示视图 */
  const tabFeed = document.getElementById('tab-feed');
  const tabSh = document.getElementById('tab-sh');
  const tabXrank = document.getElementById('tab-xrank');
  const tabPos = document.getElementById('tab-pos');
  const tabUsage = document.getElementById('tab-usage');
  const daynav = document.getElementById('daynav');
  const qstrip = document.getElementById('qstrip');
  const TABS = { feed: [tabFeed, viewFeed], sh: [tabSh, viewSh],
                 xrank: [tabXrank, viewXrank], pos: [tabPos, viewPos],
                 usage: [tabUsage, viewUsage] };
  const HASH = { feed: '#', sh: '#shanghai', xrank: '#xrank', pos: '#portfolio', usage: '#usage' };
  async function activate(name, scroll) {
    const operation = ++navigationOperation;
    if (!TABS[name]) name = 'feed';
    const button = TABS[name][0];
    if (!button.dataset.label) button.dataset.label = button.textContent;
    try {
      await loadTab(name);
      if (operation !== navigationOperation) return;
      button.textContent = button.dataset.label;
      for (const [n, pair] of Object.entries(TABS)) {
        pair[0].classList.toggle('active', n === name);
        pair[1].classList.toggle('hidden', n !== name);
      }
      daynav.style.display = name === 'feed' ? '' : 'none';
      qstrip.classList.toggle('on', name === 'pos');
      if (name === 'feed') {
        const d = days[idx];
        curDate.textContent = (d === today ? '今天 ' : '') + d;
        curCount.textContent = dayCounts[d] + ' 条';
        prev.disabled = idx >= days.length - 1;
        next.disabled = idx <= 0;
        todayBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
      }
      if (name === 'sh') {
        const t = document.getElementById('sh-' + today);
        if (t && scroll !== false) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      history.replaceState(null, '', HASH[name]);
      fabLastY = -1;
      fabUpdate();
    } catch (error) {
      if (operation !== navigationOperation) return;
      button.textContent = '加载失败，点击重试';
    }
  }
  tabFeed.addEventListener('click', ()=>activate('feed'));
  tabSh.addEventListener('click', ()=>activate('sh'));
  tabXrank.addEventListener('click', ()=>activate('xrank'));
  tabPos.addEventListener('click', ()=>activate('pos'));
  tabUsage.addEventListener('click', ()=>activate('usage'));

  /* 上一条/下一条浮动按钮：在当前可见视图的卡片间跳转，边界隐藏（占位隐藏保持位置固定） */
  const fabPrev = document.getElementById('fab-prev');
  const fabNext = document.getElementById('fab-next');
  let fabLastY = -1, fabLastIdx = 0;  // 上次跳转前的滚动位置与目标索引：边界卡顿时沿索引继续走
  function fabCards() {
    const view = [viewFeed, viewSh, viewXrank, viewPos, viewUsage].find(v => !v.classList.contains('hidden'));
    return view ? [...view.querySelectorAll('.card')].filter(c => c.offsetHeight > 0) : [];
  }
  function fabCur(cards) {
    const anchor = 170;  // 视口顶部参考线（sticky header 下方）
    const i = cards.findIndex(c => c.getBoundingClientRect().bottom > anchor);
    return i === -1 ? cards.length - 1 : i;
  }
  function fabUpdate() {
    const cards = fabCards();
    const cur = cards.length ? fabCur(cards) : -1;
    const pinned = Math.abs(window.scrollY - fabLastY) < 2 && fabLastY >= 0;
    const eff = pinned ? fabLastIdx : cur;  // 卡顿时按虚拟索引判断边界
    fabPrev.classList.toggle('off', eff <= 0);
    fabNext.classList.toggle('off', eff === -1 || eff >= cards.length - 1);
  }
  function fabJump(dir) {
    const cards = fabCards();
    if (!cards.length) return;
    // 上次跳转后滚动位置没变（已到页面滚动极限），从上次目标索引继续递增
    const cur = Math.abs(window.scrollY - fabLastY) < 2 && fabLastY >= 0
      ? fabLastIdx : fabCur(cards);
    const i = Math.min(Math.max(cur + dir, 0), cards.length - 1);
    fabLastIdx = i;
    fabLastY = window.scrollY;
    cards[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
    fabUpdate();
  }
  fabPrev.addEventListener('click', ()=>fabJump(-1));
  fabNext.addEventListener('click', ()=>fabJump(1));
  addEventListener('scroll', fabUpdate, { passive: true });
  addEventListener('resize', fabUpdate, { passive: true });

  await renderMarkdown(viewFeed);
  applyShown();
  const dayHash = location.hash.match(/^#d-(\d{4}-\d{2}-\d{2})$/);
  if (dayHash && days.includes(dayHash[1])) {
    idx = days.indexOf(dayHash[1]);
    await show(true);
  } else {
    await show(false);
    if (location.hash === '#usage') await activate('usage');
    else if (location.hash === '#shanghai') await activate('sh');
    else if (location.hash === '#xrank') await activate('xrank');
    else if (location.hash === '#portfolio') await activate('pos');
  }
  fabUpdate();

  async function prefetchTabs() {
    for (const name of ['sh', 'xrank', 'pos', 'usage']) {
      try { await loadTab(name); } catch (error) {}
    }
  }
  /* 等首屏 load 完成后再空闲预加载，且不设 timeout 强跑，避免与首屏/昨日分片抢带宽 */
  function schedulePrefetch() {
    if ('requestIdleCallback' in window) requestIdleCallback(prefetchTabs);
    else setTimeout(prefetchTabs, 3000);
  }
  if (document.readyState === 'complete') schedulePrefetch();
  else addEventListener('load', schedulePrefetch, { once: true });
})();
</script>
