<section class="day" id="d-2026-11-04" data-day="2026-11-04" data-count="4"><div class="dayhead"><span class="dnum">11月4日 周三</span><span class="n">2026-11-04 · 4 条</span></div><div class="card"><h2>个人选题｜AI 做的 PPT 好不好，别在电脑上验收：我把它投到手机直播间，才发现字号全废了</h2><div class="badges"><span class="badge level-info">info</span><span class="badge">personal_topic_bot</span><span class="badge time">21:48</span></div><div class="body" data-md="## 选题建议：AI 做的 PPT 好不好，别在电脑上验收：我把它投到手机直播间，才发现字号全废了

**建议平台**：公众号｜**目标读者**：要用 AI 做线上分享、直播课件、客户提案的职场人和独立创作者，尤其是观众主要在手机小屏上看的那批人。｜**主目标**：收藏

**公共问题**：AI 生成的演示文档，到底该在哪儿验收才算数？为什么在电脑上看着没问题的排版，一到手机小屏就全废了？
**故事弧**：起因：主人拿到 AI 生成的 30 页 Keynote，本地 Keynote 打开逐页点戳，确认元素不移位、字体不丢失，验收通过（doc-c4bd896e81de）。转折：他意识到观众是在手机直播间看，提出「把较小的字适当调大，尽量不要导致错位折行」（9bb94c1766aeda5b）。结果：进一步判断「最小的字号得 18 或 20 号打底，为此可以适当牺牲个别不重要的文字段落」，并要求输出副本而非改源文件（de405b0de80a112b）。这是一条完整的「技术验收通过 → 场景验收失败 → 重定规则」的决策链。
**核心断言**：AI 生成物的验收坐标系应该从「生成端」换成「最终投放终端」：同一份文档在电脑上验收通过、在手机直播间不可读，不是 AI 不行，是验收位置选错了；先定终端的最小可读底线，再倒推删哪些内容，比事后逐页调字号省一个数量级的返工。
**大众第一反应**：AI 做 PPT 已经能用了，但细节还得人工调。｜**切入方式**：换坐标系

### 为什么建议这个选题

这是主人一手踩出来的验收盲区：AI 生成的 Keynote 在本地看排版完美，但目标场景是手机竖屏直播间，最小字号不够大，必须牺牲部分文字换可读性。为什么现在值得写：AI 生成 PPT 已经从「能不能生成」进入「怎么验收」阶段，而绝大多数人还在用生成端视角验收，缺一套按投放场景倒推的验收清单。为什么是主人的题：他既有 30 页真实交付（398 个可编辑文本框、位图 0）的验收数据，又有这次手机端返工的真实动作，还有「先出 6 页样稿定规则再批量」的工作流，物证链完整。

**传播钩子**：反差：后台验收数据漂亮到「398 个可编辑文本框、位图 0、全量文字回读校验通过」，结果一放到手机直播间，最小字号根本看不清——技术指标全过，使用场景全崩。
**读者为什么转发**：做过直播/线上分享、或用 AI 做 PPT 的人，会因为「我也在电脑上验收过就上线了」的既视感，转给同样要做线上分享的同事或合伙人。
**可能的转发文案**：AI 做的 PPT 别在电脑上验收，投到手机直播间才知道字号全废了。
**读者能带走**：一套「按投放终端倒推排版」的验收方法：先定最小字号底线（手机直播 18–20 号打底），再允许删减次要文字段落；先出少量样稿锁定规则，再批量生成；验收必须在真实终端上做，不在生成工具里做。
**开头兑现**：开场用后台验收数据：398 个独立可编辑文本框、位图图片 0、全量文字回读校验通过——然后一句「这份文档投到手机直播间，最小的字根本看不清」。

**主编发散路径**：种子只是一句字号调整指令，主编把它放大成公共命题：AI 生成物的验收标准不该由生成端定义，而应由最终投放终端倒推。发散依据是主人自己已有的「先出 6 页样稿锁定排版规则、再允许 Agent 批量制作」的工作流——两件事合起来，正好构成「规则先行 + 终端验收」的完整方法论。
**证据链**：
- AI 生成的 PPT 在本地软件里可编辑、验收数据漂亮，但这不等于在真实观看场景里可用（支撑：doc-c4bd896e81de, 9bb94c1766aeda5b）
- 真实约束是手机直播间的小屏，字号底线必须先定，再倒推删减内容（支撑：de405b0de80a112b, 9bb94c1766aeda5b）
- 先出少量样稿锁定排版规则、再批量生成，是避免大规模返工的关键工序（支撑：doc-78eeac076747）
- 改稿要输出副本、不动源文件，是保留可回退版本的基本纪律（支撑：de405b0de80a112b）

### 大致谋篇布局

1. **开场：一份验收数据全绿的 PPT，在手机直播间翻车**：doc-c4bd896e81de 提供 398 文本框/位图 0/回读校验通过的验收数据；9bb94c1766aeda5b 提供「手机直播间观看」这一真实约束
2. **为什么电脑上验收不算数：生成端和观看端是两个坐标系**：de405b0de80a112b 的「18 或 20 号打底」判断，说明可读性底线由终端决定；doc-041919508e08 中「截图页按手机竖屏卡片设计」印证主人早已有终端意识
3. **正确工序：先出样稿锁规则，再批量生成，最后在真实终端验收**：doc-78eeac076747 的 6 页样稿定排版规则、确认后才允许批量制作 24 页
4. **改稿纪律：输出副本、不动源文件，保留可回退版本**：de405b0de80a112b 明确要求「不要直接改源文件而是输出为副本」
5. **读者带走：一张按投放终端倒推的验收清单**：综合 de405b0de80a112b、9bb94c1766aeda5b、doc-78eeac076747 提炼为可执行清单

- 素材 `doc-c4bd896e81de`｜AI改稿参考原稿：# AI 做 PPT，现在发展到哪一步了？ ### 一次真实任务中的 30 页交付与工作流记录 前几天，为了刘润直播间的一场 120 分钟分享，我拿到了一份 30 页的 PPTX 文件。 对于演示文档的交付，我习惯在本地办公软件里进行实际检验。我实际用 Keynote 打开编辑，效果不错。后台验收数据显示：全文档共有 398 个独立可编辑文本框、位图图片为 0，全量文字回读校验通过。 这份文档并不是把设计稿切成图片打进幻灯片里的半成品，而是一份能在本地软件中继续修改文案与调整结构的完整演示文稿。 能拿到这个结果，对我来说是一次预料之外的顺利交付。因为在去年制作一门系统课程时，我在使用一些 AI 生成 PPT 的工具时，经历并不算愉快。 当时我接触到的那些工具，在浏览器网页里展示时通常视觉表现良
- 素材 `doc-78eeac076747`｜人工修改工作稿：1. 演示封面 2. 120 分钟内容总览导览 3. 章节大标题转场页 4. 典型商业内容页 5. 核心金句页 6. 总结结尾页 这 6 页样稿覆盖了后续制作涉及的主要排版，包括标题与正文的字号比例、深炭底色与橙色高亮的搭配规则、信息卡片的内边距以及多列布局的网格间距。 待我确认了这 6 页样稿的排版规则后，Agent 才被允许调度底层引擎，按照既定规则展开后续 24 页内容的批量制作。 完成后，Agent 自动打开了本机的 Keynote，对可编辑性进行了确认。 我自己也接管过来，亲自点点戳戳，看各个元素是否会出现意外移位、字体丢失等。看来没啥问题。 5/ 这是个什么技术原理呢？我好奇就研究了下。 以往许多网页端工具导出的演示文档之所以难以在本地软件中编辑，主要原因在于排版模型的差异。 前端开发常用的 HTML/CSS 属于流式布局，元素尺寸通常依靠内容自适应撑开；而本地演示软件（如 PowerPoint 或 Keynote）的底层是基于绝对坐标系统的二维矢量
- 素材 `doc-041919508e08`｜项目背景与策划思考：清单； 3. 交 ppt skill 出成片（深色底、大字数字页、截图页按手机竖屏卡片设计）； 4. 成片总验收：全场 63 个页标题连起来读，要能独立成文； 5. 如需逐字稿：以六句过桥词为骨架扩写，语速按 230–250 字/分钟，120 分钟约 2.8–3 万字（含互动弹性）。 ## 七、环境提示（给接手的模型） - 工作目录 `/Users/xdash/MyAI`；`Writings/` 是指向 `/Users/xdash/Documents/Obsidian_Sync/Writings` 的软链，不在 git 内，改动不用提交。 - 书稿在 `Writings/fde-book/chapters/`（写作版）与 `Writings/fde-book/github/`（开源版镜像），引用素材时两个目录内容基本一致，以 chapters/ 为准。 - 本机 WebSearch 未配置、grok CLI 需系统代理（proxy_guard.py 检查）；外网检索可用 Fetch
