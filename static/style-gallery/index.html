自然质感、真实纹理、柔和层次、细节刻画与轻盈光感；另一部分内容采用极简2D手绘简笔画表现，强调概括造型、轻柔线条、低细节、适度留白与天真趣味。两种画法并置共存，形成明确可辨的风格反差，同时保持统一、和谐、克制的审美协调。 主体角色或主要视觉对象优先采用2D插画化表现，保持平面感、手绘感与概括感，不要做成照片感、3D感或厚重写实感；其余环境、植物、材质、局部场景元素可适度引入细腻半写实表现，另有部分装饰性元素可继续使用极简手绘简笔语言。整体应保留“主体偏2D、局部写实、局部简笔”的清晰层次关系。 整体气质轻盈、温柔、治愈、清新、诗意，带有文艺感与绘本感。色彩以低饱和、高明度、柔和通透的浅色系为主，避免浓烈对比、厚重综合色块和高饱和炫目视觉。背景倾向干净、简洁、留白充足，不过度堆叠信息，画面重视呼吸感、秩序感与视觉节奏。 写实部分不要过度摄影化，不要强烈商业修图感，不要走照片级写实路线；简笔部分不要复杂化，不追求真实结构与繁复刻画，应保留手绘的松弛感、稚拙感与亲和力。线条细而柔和，造型圆润、概括、克制，整体呈现“精致与天真并存”“真实与童趣并存”的视觉效果。 风格重点不是把所有内容统一成单一画法，而是保留“精细写实”与“简洁手绘”之间清晰可辨的差异，并让这种差异成为画面的核心风格特征。整体不做厚涂，不做3D，不做强戏剧光影，不做复杂纹样堆砌，不做过强体积塑造，不做商业海报式锐利修饰。", "group": "FB", "group_label": "FB 经典绘本叙事", "usage": "风格：FB-034 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FB-035.webp", "name": "FB-035 · Charlie Mackesy Expressive Ink & Watercolor Storybook", "sub": "Charlie Mackesy", "desc": "参考绘本作者Charlie Mackesy", "group": "FB", "group_label": "FB 经典绘本叙事", "usage": "风格：FB-035 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FB-036.webp", "name": "FB-036 · Liz Climo Minimal Animal Cartoon Storybook", "sub": "Liz Climo", "desc": "参考绘本作者Liz Climo", "group": "FB", "group_label": "FB 经典绘本叙事", "usage": "风格：FB-036 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FB-037.webp", "name": "FB-037 · Naoko Takagi Warm Daily Life Storybook", "sub": "Naoko Takagi", "desc": "参考绘本作者Naoko Takagi", "group": "FB", "group_label": "FB 经典绘本叙事", "usage": "风格：FB-037 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FB-038.webp", "name": "FB-038 · Yoko Sano Whimsical Crayon & Watercolor Storybook", "sub": "Yoko Sano", "desc": "参考绘本作者Yoko Sano", "group": "FB", "group_label": "FB 经典绘本叙事", "usage": "风格：FB-038 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FB-039.webp", "name": "FB-039 · Emily Hughes Wild Lush Botanical Storybook", "sub": "Emily Hughes", "desc": "参考绘本作者Emily Hughes", "group": "FB", "group_label": "FB 经典绘本叙事", "usage": "风格：FB-039 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FB-040.webp", 055 · Republic-Era Advertising Redesign", "sub": "民国广告画再设计", "desc": "旧商业人物、平涂、复古字体结构、现代化简化。", "group": "FE", "group_label": "FE 新国风与传统工艺", "usage": "风格：FE-055 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FE-056.webp", "name": "FE-056 · Pale Lacquer & Raden Decorative Illustration", "sub": "素漆螺钿插画风", "desc": "**当代新中式浅色漆画式二维装饰插画，融合中国古典人物画的造型语言与现代平面设计。整体首先呈现为平面装饰画，而非传统工笔写实绘画。造型高度概括，轮廓完整流畅，人物比例与形态根据主题自适应，但始终保持简化、纤细、含蓄；面部几乎不塑造真实体积，五官简洁、符号化、留白化，肤色均匀平整。** **以清晰轮廓、大面积平涂色块和极少量柔和过渡塑造形体，内部细节明显删减并图案化；弱明暗、弱透视、弱空间纵深，不表现真实光源，不使用空气透视和写实景深。** **整体采用高明度、浅暖色基调，但避免颜色过度灰化、粉化和褪色。画面约 65%–80% 保持象牙白、米白、浅杏、暖灰、浅玉色等明亮区域；朱砂、石青、石绿、灰蓝、浅赭等传统矿物色作为有限的中等面积色块使用。整体饱和度在原有浅雅基础上轻微提升约 10%–15%，使朱砂更鲜润、石青更清透、石绿更明确，但仍保持柔和克制，不进入高饱和、浓艳或艳俗状态。** **色彩关系强调“浅底 + 少量较纯色块”的对比：大面积背景和肤色继续保持低饱和、高明度，服饰边缘、器物、花叶、局部装饰可以使用稍纯一些的朱砂红、石青蓝、石绿色形成视觉节奏。避免整幅画平均增艳，也避免所有颜色同时提高饱和度。** **深色只承担少量轮廓、结构与视觉锚点，禁止形成大面积黑色或深褐色块，避免黑漆底、暗金底和厚重宫廷色调。深色面积应明显少于浅色和中性色，整体仍保持通透、明亮、柔和。** **表面保留中国传统漆艺的温润、细腻和微微矿物质感，但以浅色漆面、哑光漆面和柔和矿物颜料质感为主。色彩表面可以具有轻微矿物颜料的颗粒感、天然色差和温润厚度，但不追求厚重黑漆、金箔堆积、高反射或珠宝般光泽。** **螺钿与贝母仅作为极少量的“装饰性镶嵌层”使用，而不是全局材质。虹彩区域控制在画面约 3%–8%，只出现在具有明确装饰属性的局部纹样、边缘、点缀区域或次要表面中；不得随机覆盖主要造型，不改变主体原本的材质属性。** **螺钿效果应呈现为薄片状、细碎、局部、克制的贝母色偏，可出现极轻微的青绿、粉紫、淡蓝虹彩，但综合色彩必须服从整体矿物色体系，而不是形成大片闪光、水晶化、金属化或珠宝化效果。** **尤其保持主体核心形态、皮肤、面部、主要大色块和大面积背景的材质纯净，不被螺钿纹理侵入。虹彩只作为视觉点睛，而不是画面主要质感。** **画面强调装饰性构成，通过平面叠压、轮廓遮挡、局部越界和形状穿插建立层次；空间更接近漆画、壁画、屏风画与现代装饰画的组织逻辑，而不是现实场景透视。** **整体气质明亮、温润、静谧、古雅、精致、轻盈、含蓄。相比传统低饱和新中式插画，色彩稍微更鲜活、更清澈、更有矿物颜料的纯净感，但仍然保持高级、克制和东方审美，不做浓艳国潮，不做鲜艳商业插画。** **避免：大面积黑色、黑漆底、暗金色调、厚重宫廷感、全局螺钿化、随机虹彩覆盖、大块贝壳拼贴、水晶化、珠宝化、过度灰粉、过度奶油色、全画面褪色、低对比到发白、浓艳国潮、高饱和撞色、荧光色、写实工笔、真实人体塑造、现代古风 CG、摄影感、电影光影、真实三维空间、写实山水透视、复杂衣纹、精细刺绣、高密度环境细节、仙侠氛围。**", "group": "FE", "group_label": "FE 新国风与传统工艺", "usage": "风格：FE-056 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FE-057.webp", "name": "FE-057 · Contemporary Peking Opera Comic Illustration", "sub": "当代戏曲漫画插画风", "desc": "当代手绘戏曲漫画插画风，借用中国京剧人物画谱、京剧脸谱和老派中国戏曲漫画的造型语言，并以现代插画审美重新简化和整理。古代人物：保留明显的戏曲角色特征。一张图中如果有多个角色，每个人都要有不同眉眼结构，让角色之间通过眼形、眉形、脸型和妆容直接形成区分；避免所有人物共用同一张“ 面具有克制的光影、略低的清晰度、自然的暗部色彩沉积，整体像经过模拟胶片扫描和统一调色处理的旧动画截图。视觉语言安静、内敛、忧郁、怀旧，带有轻微的梦境感和疏离感，质朴而不精致化，强调二维手绘痕迹、色彩氛围和年代质感。", "group": "FG", "group_label": "FG 动漫和赛璐璐", "usage": "风格：FG-023 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FG-024.webp", "name": "FG-024 · Makoto Shinkai Your Name", "sub": "新海诚《你的名字。》 / Makoto Shinkai Your Name", "desc": "", "group": "FG", "group_label": "FG 动漫和赛璐璐", "usage": "风格：FG-024 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FG-025.webp", "name": "FG-025 · Perler Bead Pixel Art", "sub": "拼豆像素画", "desc": "规则排列的圆形拼豆珠孔网格、像素对齐结构、手工塑料熔珠轻微颗粒肌理与受热微熔接痕迹、鲜明纯正的平涂色彩、清晰硬朗的阶梯状像素边缘", "group": "FG", "group_label": "FG 动漫和赛璐璐", "usage": "风格：FG-025 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FH-001.webp", "name": "FH-001 · Editorial Doodle", "sub": "Editorial Doodle / 社论涂鸦", "desc": "随手黑线、少量点色、人物 + 概念、白底。", "group": "FH", "group_label": "FH 先锋实验与综合媒介", "usage": "风格：FH-001 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FH-002.webp", "name": "FH-002 · Loose Ink", "sub": "Loose Ink / 松散墨线", "desc": "不稳定笔压、断续墨线、快速动作、即兴感。", "group": "FH", "group_label": "FH 先锋实验与综合媒介", "usage": "风格：FH-002 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FH-003.webp", "name": "FH-003 · Conceptual Line Drawing", "sub": "Conceptual Line Drawing / 概念线描", "desc": "极少线条、视觉隐喻、图形脑洞、留白。", "group": "FH", "group_label": "FH 先锋实验与综合媒介", "usage": "风格：FH-003 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FH-004.webp", "name": "FH-004 · Classic Magazine Single-Panel Cartoon", "sub": "New Yorker 单格社论漫画", "desc": "黑线、成人场景、冷脸人物、一个情境一个笑点。", "group": "FH", "group_label": "FH 先锋实验与综合媒介", "usage": "风格：FH-004 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FH-005.webp", "name": "FH-005 · French Café Sketch", "sub": "法式 Café Sketch", "desc": "轻盈钢笔墨线速写、修长写意造型、透明水彩淡彩点染、大面积自然留白、松弛明快的都市速写感。", "group": "FH", "group_label": "FH 先锋实验与综合媒介", "usage": "风格：FH-005 主题：…"}, {"img": "style_gallery_assets/handdraw/individual/FH-006.webp", "name": function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function thumbHtml(c, wide) {
  if (c.iframe) {
    return `<a class="iframe-wrap" href="${esc(c.iframe)}" target="_blank" rel="noopener">
      <iframe src="${esc(c.iframe)}" loading="lazy" tabindex="-1" scrolling="no"></iframe>
      <span class="open-tip">打开 deck ↗</span></a>`;
  }
  if (c.img) {
    const inner = c.link
      ? `<a class="thumb ${wide ? "contain" : ""}" style="background-image:url('${esc(c.img)}')" href="${esc(c.link)}" target="_blank" rel="noopener"><span class="open-tip">打开 demo ↗</span></a>`
      : `<div class="thumb ${wide ? "contain" : ""}" style="background-image:url('${esc(c.img)}')"></div>`;
    return inner;
  }
  if (c.colors && c.colors.length) {
    return `<div class="swatches">${c.colors.map(h => `<span style="background:${esc(h)}" title="${esc(h)}"></span>`).join("")}</div>`;
  }
  return `<div class="thumb"><div class="no-img">文字规格 · 按需生成</div></div>`;
}

function cardHtml(c, kind, wide) {
  const search = [c.name, c.sub, c.desc, c.usage, c.palette, c.rendering, c.group].filter(Boolean).join(" ").toLowerCase();
  const visual = (kind === "text") ? "" : thumbHtml(c, wide || kind === "iframe");
  return `<div class="card" data-group="${esc(c.group || "")}" data-search="${esc(search)}">
    ${visual}
    <div class="body">
      <div class="name">${esc(c.name)}</div>
      ${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ""}
      ${c.palette ? `<div class="sub">调色板 ${esc(c.palette)} × 技法 ${esc(c.rendering)}</div>` : ""}
      ${c.desc ? `<div class="desc">${esc(c.desc)}</div>` : ""}
      ${c.use ? `<div class="desc">适用：${esc(c.use)}</div>` : ""}
      ${c.usage && c.usage !== "—" ? `<div class="usage">${esc(c.usage)}</div>` : ""}
    </div>
  </div>`;
}

    }
    html += `<section id="${s.id}">
      <div class="sec-head">

        <p class="intro">${esc(s.intro)}</p>

      ${filterHtml}
      <div class="grid ${wide ? "wide" : ""}" data-sec="${s.id}">

      </div>
      <div class="empty-note hidden" data-sec="${s.id}">当前筛选 / 搜索无匹配。</div>
    </section>`;
  }
}

document.querySelectorAll(".filters .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const sec = chip.parentElement.dataset.sec;
    chip.parentElement.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    chip.classList.add("on");
    activeFilter[sec] = chip.dataset.g;
    applyView(sec);
  });
});

// ── 搜索 ──
let query = "";
document.getElementById("search").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  document.querySelectorAll("section").forEach(sec => applyView(sec.id));
});

function applyView(secId) {
  const grid = document.querySelector(`.grid[data-sec="${secId}"]`);
  if (!grid) return;
  const g = activeFilter[secId] || "";
  let visible = 0;
  grid.querySelectorAll(".card").forEach(card => {
    const okG = !g || card.dataset.group === g;
    const okQ = !query || card.dataset.search.includes(query);
    const show = okG && okQ;
    card.classList.toggle("hidden", !show);
    if (show) visible++;
  });
  const note = document.querySelector(`.empty-note[data-sec="${secId}"]`);
  if (note) note.classList.toggle("hidden", visible > 0);
}

// ── 滚动高亮导航 ──
const secEls = [...document.querySelectorAll("section")];
const navLinks = [...document.querySelectorAll(".nav a")];
window.addEventListener("scroll", () => {
  let current = secEls[0]?.id;
  for (const s of secEls) {
    if (s.getBoundingClientRect().top < 120) current = s.id;
  }
  navLinks.forEach(a => a.classList.toggle("active", a.dataset.sec === current));
}, { passive: true });
</script>
</body>
</html>
